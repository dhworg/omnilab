# omnilab.yaml — generated by `omnilab new {name} --template mujoco`.
# Pin `image` to a SHA256 digest before sharing this project.
#
# This is a bare MuJoCo project. For a working demo with a model, a ROS
# bridge, and observers.yaml, install the full template instead:
#   omnilab template install mujoco-pendulum
name: {name}
host_min_version: 0.1.0
image: ghcr.io/dhworg/ros-jazzy-mujoco:latest

simulator: mujoco

ros:
  rmw: rmw_cyclonedds_cpp
  domain_id: 42

mujoco:
  model: sim/model.xml       # MJCF file, relative to the project dir
  bridge: sim/mujoco_bridge.py  # publishes /clock + /joint_states; remove
                                # to fall back to the bare viewer

gpu: auto              # auto | igpu | nvidia

hardware:
  micro_ros: disabled  # the mujoco image is sim-only; use the
                       # ros-jazzy-gz-harmonic image for hardware work

skills: []
