# Agent-perception predicates for the pendulum. State paths come from
# what the bridge publishes: /joint_states maps to joints.<name>.position
# / .velocity / .effort. See docs/examples/observers/ for richer setups.
#
# Visual verification works here: the bridge pauses physics, renders the
# exact current step, and answers omnilab observe's capture protocol —
# so verdicts can reach verification_mode: verified, same as Gazebo.

motion_classes:
  - name: swinging
    when: "abs(joints.swing.velocity) > 0.2"
  - name: settled
    when: "abs(joints.swing.velocity) <= 0.2 AND abs(joints.swing.position) < 0.15"

anomalies:
  - name: runaway_spin
    # A damped pendulum can never exceed this; firing means the physics
    # blew up (bad timestep edit, external force injection).
    when: "abs(joints.swing.velocity) > 20"
    cooldown: 5s
