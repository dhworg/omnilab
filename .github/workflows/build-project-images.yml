# Build every project image (matrix), run each image's in-image smoke
# test, and on push to main publish to GHCR as `:latest` and
# `:sha-<commit>`. PR builds skip the GHCR push.
#
# Adding an image = new projects/<name>/ dir with Containerfile +
# smoke-test.sh, plus one matrix entry below.
#
# Path-filtered so changes that only touch host/, cli/, etc. don't fire
# this expensive build.
name: build-project-images

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/build-project-images.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/build-project-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [ros-jazzy-gz-harmonic, ros-jazzy-mujoco]
    name: Build + smoke + push (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project image
        run: |
          sudo podman build \
            --tag "${{ matrix.image }}:latest" \
            --file "projects/${{ matrix.image }}/Containerfile" \
            "projects/${{ matrix.image }}/"
          sudo podman images "localhost/${{ matrix.image }}"

      - name: Smoke test
        run: |
          sudo podman run --rm "localhost/${{ matrix.image }}:latest" \
            bash /usr/local/bin/smoke-test.sh

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push project image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: dhworg/${{ matrix.image }}
        run: |
          sudo podman tag "localhost/${{ matrix.image }}:latest" "$REGISTRY/$IMAGE_NAME:latest"
          sudo podman tag "localhost/${{ matrix.image }}:latest" "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA}"
          sudo podman push "$REGISTRY/$IMAGE_NAME:latest"
          sudo podman push "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA}"
