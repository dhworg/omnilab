# Build the omnilab-host OCI image, push to GHCR on main, bake an
# installable ISO with bootc-image-builder, and upload that ISO as a
# workflow artifact.
#
# Per project-spec-v1.md (rev 3) § "Install behavior", the ISO supports
# two variants:
#
#   interactive (default)   Anaconda runs its full UI, user creates their
#                           own account during install. No baked
#                           credentials. This is the production /
#                           physical-machine variant. Default for push to
#                           main, PRs, tags, and unspecified
#                           workflow_dispatch.
#
# The `dev` auto-install variant was REMOVED in architecture rev 5: it
# wiped the target disk and carried baked credentials, and its only purpose
# was fast VM iteration on the host image, which is no longer on the
# critical path. v1 publishes no ISO artifacts at all.
#
# Phase B.6 will add smoke-tests.yml that runs the seven smoke tests
# against the qcow2 in a VM.
name: build-host-iso

# Architecture rev 5: the bootc host is a v2 appliance deliverable, not part
# of v1. This workflow is therefore MANUAL ONLY — it must not gate v1 PRs.
#
# It is also currently RED, and not from anything in this repo: the
# Containerfile is unchanged since it last built green on 2026-05-20, but it
# installs from live Fedora 42 repos, so upstream drift has made the GNOME
# extension set unsatisfiable under --setopt=install_weak_deps=False
# (libgdk_pixbuf, libgraphene, liblcms2, libasound). Fixing that is v2 work;
# pinning the package set is the real answer when the appliance path resumes.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'ISO variant — interactive only (the dev auto-install variant was removed in rev 5).'
        type: choice
        options:
          - interactive
        default: interactive

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dhworg/omnilab-host
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

# Cancel in-flight PR runs when a new commit is pushed to the PR branch.
# Always let main runs finish so we don't lose published artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'interactive' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build host image and ${{ inputs.variant || 'interactive' }} ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60

    env:
      # Default to interactive for push, pull_request, and tag events.
      # workflow_dispatch overrides via inputs.variant.
      VARIANT: ${{ inputs.variant || 'interactive' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        run: |
          echo "Building ISO variant: $VARIANT"
          case "$VARIANT" in
            interactive)
              echo "Anaconda will run its full UI. NO baked credentials."
              ;;
            dev)
              echo "ERROR: the dev ISO variant was removed in architecture rev 5." >&2
              echo "It auto-installed (wiping the target disk) and carried baked" >&2
              echo "credentials. Its only purpose was fast VM iteration on the host" >&2
              echo "image, which is no longer on the critical path." >&2
              exit 1
              ;;
            *)
              echo "ERROR: unknown variant '$VARIANT'." >&2
              exit 1
              ;;
          esac

      - name: Build host OCI image
        run: |
          sudo podman build \
            --tag omnilab-host:latest \
            --file host/Containerfile \
            host/
          sudo podman images localhost/omnilab-host

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push host OCI image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo podman tag omnilab-host:latest "$REGISTRY/$IMAGE_NAME:latest"
          sudo podman tag omnilab-host:latest "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA}"
          sudo podman push "$REGISTRY/$IMAGE_NAME:latest"
          sudo podman push "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA}"

      - name: Pull bootc-image-builder
        run: sudo podman pull "$BIB_IMAGE"

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output

          # Common bootc-image-builder args.
          BIB_ARGS=(
            --type anaconda-iso
            --rootfs xfs
            --local
            localhost/omnilab-host:latest
          )

          # Common volume mounts.
          VOLUMES=(
            --volume "$PWD/output:/output"
            --volume /var/lib/containers/storage:/var/lib/containers/storage
          )

          # config.toml is mandatory: without it bootc-image-builder embeds
          # an autoinstall kickstart that wipes the only disk and skips user
          # creation. `unattended = false` is what keeps Anaconda interactive.
          VOLUMES+=(--volume "$PWD/host/config.toml:/config.toml:ro")

          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            "${VOLUMES[@]}" \
            "$BIB_IMAGE" \
            "${BIB_ARGS[@]}"

          sudo chown -R "$(id -u):$(id -g)" output
          echo "--- output tree ---"
          find output -type f -printf '%p  %s bytes\n'

      # Architecture rev 5: v1 publishes NO ISO artifacts. The host image
      # still builds so the v2 appliance path stays alive, but nothing
      # downloadable is produced — an ISO that cannot dual-boot should not
      # be sitting in the artifacts list waiting to erase someone's disk.
      - name: Report ISO build (not published)
        run: |
          echo "ISO built for verification only; not uploaded (rev 5)."
          find output -type f -name '*.iso' -printf '%p  %s bytes\n' || true
